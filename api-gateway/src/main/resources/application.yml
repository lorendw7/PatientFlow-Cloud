server:
  port: 4004

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patient-server-route
              uri: http://patient-service:4000
              predicates:
                - Path=/api/patients/**
              filters:
                - StripPrefix=1

            - id: api-docs-route
              uri: http://patient-service:4000
              predicates:
                - Path=/api-docs/**
              filters:
                - RewritePath=/api-docs/patients, /v3/api-docs